# docker-compose.yml
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookstoredb
    ports:
      - "3306:3306"
    healthcheck:
      test:
      interval: 10s
      timeout: 5s
      retries: 10
  
  app:
    build:.
    depends_on:
      db:
        condition: service_healthy